name: Build Docker Image (Fork)

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g., latest, v1.0.0)'
        required: false
        default: 'latest'
      build_web:
        description: 'Build web frontend'
        required: false
        default: 'true'
        type: boolean
      build_admin:
        description: 'Build admin frontend'
        required: false
        default: 'true'
        type: boolean
      build_mobile:
        description: 'Build mobile frontend'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-server-native:
    name: Build Server Native - ${{ matrix.targets.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        targets:
          - name: x86_64-unknown-linux-gnu
            file: server-native.x64.node
          # Uncomment for multi-arch support
          # - name: aarch64-unknown-linux-gnu
          #   file: server-native.arm64.node
          # - name: armv7-unknown-linux-gnueabihf
          #   file: server-native.armv7.node

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server-native

      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.targets.name }}
          package: '@affine/server-native'

      - name: Rename ${{ matrix.targets.file }}
        run: |
          mv ./packages/backend/native/server-native.node ./packages/backend/native/${{ matrix.targets.file }}

      - name: Upload ${{ matrix.targets.file }}
        uses: actions/upload-artifact@v4
        with:
          name: server-native-${{ matrix.targets.file }}
          path: ./packages/backend/native/${{ matrix.targets.file }}
          if-no-files-found: error

  build-web:
    name: Build @affine/web
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_web == true }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build Web
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: 'stable'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
          if-no-files-found: error

  build-admin:
    name: Build @affine/admin
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_admin == true }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build Admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: 'stable'

      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist
          if-no-files-found: error

  build-mobile:
    name: Build @affine/mobile
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mobile == true }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build Mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: 'stable'

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs:
      - build-server-native
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env

      - name: Download server-native
        uses: actions/download-artifact@v4
        with:
          pattern: server-native-*
          merge-multiple: true
          path: ./packages/backend/native

      - name: List server-native files
        run: ls -alh ./packages/backend/native

      - name: Build Server
        run: yarn workspace @affine/server build

      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
          if-no-files-found: error

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-server
      - build-web
      - build-admin
      - build-mobile
    # Allow partial failures from conditional jobs
    if: ${{ always() && needs.build-server.result == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist

      - name: Download web artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web
          path: ./packages/frontend/apps/web/dist

      - name: Download admin artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: admin
          path: ./packages/frontend/admin/dist

      - name: Download mobile artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          logout: false
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com
          scope: '@toeverything'

      - name: Install Node.js dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules
        run: mv ./node_modules ./packages/backend/server

      - name: Determine Docker tags
        id: docker-tags
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_OWNER_LOWER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')

          # Default tags
          TAGS="ghcr.io/${REPO_OWNER_LOWER}/affine:latest"
          TAGS="${TAGS},ghcr.io/${REPO_OWNER_LOWER}/affine:${{ github.sha }}"

          # Add custom tag if provided via workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_OWNER_LOWER}/affine:${{ inputs.tag }}"
          fi

          # Add branch-specific tag
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_TAG=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
          TAGS="${TAGS},ghcr.io/${REPO_OWNER_LOWER}/affine:${BRANCH_TAG}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Docker tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          # Uncomment for multi-arch support:
          # platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: true
          file: .github/deployment/node/Dockerfile
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: Output image information
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo ""
          echo "Available tags:"
          echo "${{ steps.docker-tags.outputs.tags }}" | tr ',' '\n'
          echo ""
          echo "To pull and run the image:"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_OWNER_LOWER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "docker pull ghcr.io/${REPO_OWNER_LOWER}/affine:latest"
          echo "docker run -p 3010:3010 ghcr.io/${REPO_OWNER_LOWER}/affine:latest"
